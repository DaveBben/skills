# Template for the repository's .gitleaks.toml. Keeps Gitleaks' default rules
# and adds one rule for each identifier format found in the stores AGENTS.md
# lists. Show each rule one synthetic match before adding it. A known false
# alarm goes in .gitleaksignore by fingerprint, never as a broader rule.
[extend]
useDefault = true

